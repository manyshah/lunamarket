name: Deploy Luna Market to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build Luna Market
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify repository structure
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "package.json"
            "index.html"
            "vite.config.ts"
            "tsconfig.app.json"
            "src/main.tsx"
            "src/App.tsx"
            "src/styles.css"
            "src/vite-env.d.ts"
            "public/luna-logo.webp"
          )

          missing=0
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required project file is missing: $file"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "Repository upload is incomplete. Upload the src and public folders as well as the root files."
            exit 1
          fi

          echo "Repository structure OK"
          find src -maxdepth 2 -type f | sort

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and build production site
        run: npm run build

      - name: Verify production output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/luna-logo.webp
          echo "Production output OK"
          find dist -maxdepth 2 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Deploy Luna Market
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
